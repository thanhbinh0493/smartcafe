# SmartCafe – chạy toàn hệ thống: docker compose up -d --build
# Web khách + admin: http://localhost:8080  |  API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcafe}
      POSTGRES_DB: ${POSTGRES_DB:-smartcafe}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"            # mở ra máy host để chạy test / xem dữ liệu
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartcafe}:${POSTGRES_PASSWORD:-smartcafe}@db:5432/${POSTGRES_DB:-smartcafe}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads   # ảnh món upload ở W05 (giữ lại khi build lại container)

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads:
