[alembic]
script_location = alembic
# Put the backend folder on sys.path so env.py can "import app" when run via the alembic CLI
prepend_sys_path = .
# Database URL is read from the DATABASE_URL env var (see alembic/env.py).
# Keep this file ASCII-only: on Windows configparser reads it with the cp1252 codepage.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
